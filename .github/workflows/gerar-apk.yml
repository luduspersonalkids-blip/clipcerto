# Compila o ClipCerto na nuvem do GitHub.
# O projeto está dentro da pasta "clipcerto" do repositório.

name: Gerar APK e Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipcerto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto
        run: bash scripts/preparar_projeto.sh

      - name: Analisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipCerto-android
          path: clipcerto/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clipcerto
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar projeto
        shell: pwsh
        run: ./scripts/preparar_projeto.ps1

      - name: Compilar Windows
        run: flutter build windows --release

      - name: Publicar versão Windows
        uses: actions/upload-artifact@v4
        with:
          name: ClipCerto-windows
          path: clipcerto/build/windows/x64/runner/Release
